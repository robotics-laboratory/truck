name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - uses: pre-commit/action@v3.0.1

  build-and-check:
    name: Build, test
    # arm64 image (same as on the Jetson), ~23 GB unpacked
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/diiikach/truck:1.1.0
    defaults:
      run: { shell: bash }

    steps:
      # The image does not fit on the runner without freeing disk space first,
      # so it is pulled explicitly instead of using `container:`.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker system prune -af
          df -h /

      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Pull image
        run: |
          docker pull "$IMAGE"
          df -h /

      # The image entrypoint is `zsh -lc`, so the command is passed as one string.
      # setuptools in the image is newer than colcon's ament_python symlink-install
      # path expects (it calls `setup.py develop --editable`, which newer setuptools
      # rejects) - pin it down before building, same as make build-all on a fresh checkout.
      - name: Build ROS2 packages
        run: |
          docker run --rm -v "$PWD:/truck" -w /truck "$IMAGE" \
            "pip3 install --no-cache-dir 'setuptools==65.5.1' && make build-all"

      - name: Test ROS2 packages
        run: docker run --rm -v "$PWD:/truck" -w /truck "$IMAGE" "make test-all"
