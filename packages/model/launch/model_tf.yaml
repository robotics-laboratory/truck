launch:
- arg:
    name: "model_path"
    default: "$(find-pkg-share model)/urdf/truck.urdf"
- arg:
    name: "simulation"
    default: "false"
- node:
    pkg: "robot_state_publisher"
    exec: "robot_state_publisher"
    name: "robot_state_publisher"
    output: "log"
    args: "$(var model_path)"
    param:
    - { name: "use_sim_time", value: "$(var simulation)" }
