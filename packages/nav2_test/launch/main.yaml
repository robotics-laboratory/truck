launch:
  - arg: { name: "simulation", default: "true" }
  - arg: { name: "qos", default: "0" }
  - arg: { name: "map_config", default: "$(find-pkg-share map)/data/map_6.geojson" }
  - arg: { name: "model_config", default: "$(find-pkg-share model)/config/model.yaml" }
  - arg: { name: "initial_x", default: "5.0" }
  - arg: { name: "initial_y", default: "4.0" }
  - arg: { name: "initial_yaw", default: "0.3" }

  - include:
      file: $(find-pkg-share simulator_2d)/launch/simulator_2d.yaml
      arg:
        - { name: "model_config", value: "$(var model_config)" }
        - { name: "map_config", value: "$(var map_config)" }
        - { name: "initial_x", value: "$(var initial_x)" }
        - { name: "initial_y", value: "$(var initial_y)" }
        - { name: "initial_yaw", value: "$(var initial_yaw)" }

  - node:
      pkg: "foxglove_bridge"
      exec: "foxglove_bridge"
      name: "foxglove_bridge"
      args: "--ros-args --log-level FATAL"
      output: "log"


  - include:
      file: $(find-pkg-share model)/launch/model_tf.yaml
      arg:
      - { name: "simulation", value: "$(var simulation)" }

  - include:
      file: $(find-pkg-share visualization)/launch/visualization.yaml
      arg:
      - { name: "simulation", value: "$(var simulation)" }
      - { name: "qos", value: "$(var qos)" }
      - { name: "map_config", value: "$(var map_config)" }

  - include:
      file: $(find-pkg-share nav2_test)/launch/ekf.yaml
      arg:
      - { name: "simulation", value: "$(var simulation)" }
      - { name: "qos", value: "$(var qos)" }
  
  - include:
      file: $(find-pkg-share control_proxy)/launch/control_proxy.yaml
      arg:
      - { name: "simulation", value: $(var simulation) }

  - include:
      file: $(find-pkg-share nav2_test)/launch/bringup_launch.py
      arg:
      - { name: use_sim_time, value: "$(var simulation)" }

#   - include:
#       file: $(find-pkg-share nav2_test)/launch/slam.yaml

  - node:
      pkg: "nav2_test"
      exec: "proxy.py"
      output: "screen"
      # name: "lidar"
      # namespace: "lidar"

      param:
      - { name: use_sim_time, value: "$(var simulation)" }
    

